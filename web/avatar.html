<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Voice Avatar</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    /* Matches assistant_app.py's background_color -- real desktop-see-
       through transparency isn't reliable on Windows/WebView2 as of
       pywebview 6.2.1 (confirmed live, see assistant_app.py comment), so
       this renders as an intentional dark floating panel instead of an
       accidental white box. */
    background: #14141c;
    width: 100%; height: 100%;
  }
  #drag-region {
    /* -webkit-app-region: drag is an Electron/Chromium-app convention --
       pywebview's Windows backend (WebView2 + WinForms) doesn't implement
       it at all, confirmed by reading its source. Dragging is instead
       driven explicitly by the mousedown listener below, which calls into
       Python's Api.start_drag() (assistant_app.py) to do the real Win32
       drag. This element just marks/sizes the draggable strip. */
    position: fixed; top: 0; left: 0; right: 0; height: 28px;
    z-index: 10;
    cursor: move;
  }
  #minimize-btn {
    position: fixed; top: 4px; right: 6px;
    width: 20px; height: 20px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,0.15);
    color: #fff; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
    z-index: 11;
  }
  #minimize-btn:hover { background: rgba(255,255,255,0.3); }
  #sensitivity-btn {
    position: fixed; top: 4px; left: 6px;
    width: 20px; height: 20px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,0.15);
    color: #fff; font-size: 11px; font-weight: 600; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
    z-index: 11;
  }
  #sensitivity-btn:hover { background: rgba(255,255,255,0.3); }
  #mute-btn {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: 52px; height: 52px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,0.15);
    color: #fff; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
    z-index: 10;
  }
  #mute-btn:hover { background: rgba(255,255,255,0.3); }
  #mute-btn.muted { background: rgba(220,60,60,0.7); }

  #status-label {
    position: fixed; bottom: 74px; left: 0; right: 0;
    text-align: center; font: 11px sans-serif; color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em; text-transform: uppercase;
    pointer-events: none;
  }

  canvas { display: block; }
</style>
</head>
<body>
  <div id="drag-region"></div>
  <button id="sensitivity-btn" title="Mic sensitivity">M</button>
  <button id="minimize-btn" title="Minimize">&#8212;</button>
  <button id="mute-btn" title="Mute">&#128266;</button>
  <canvas id="orb"></canvas>
  <div id="status-label">idle</div>

<script>
const canvas = document.getElementById('orb');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---- State ----------------------------------------------------------
let state = 'idle';           // idle | listening | recording | transcribing | thinking | synthesizing | speaking
let muted = false;
let targetAmplitude = 0;      // 0..1, set by setAmplitude(), driven toward by smoothedAmplitude
let smoothedAmplitude = 0;
let t = 0;                    // animation clock, seconds

// Warm palette (amber/coral/gold) rather than the blue/violet family most
// voice-assistant UIs default to -- reads as friendlier/warmer, and stays
// clear of ChatGPT voice mode's specific blue-dominated look. "thinking"
// is the one deliberate excursion into rose/violet: giving the (usually
// longest) wait its own distinct identity is worth breaking the family
// for. "transcribing" is a brief golden flash -- it's a short state (just
// the Whisper pass), so it doesn't need its own long-term identity, just
// to visibly not be "thinking" yet. "synthesizing" sits visually between
// "thinking" (violet) and "speaking" (coral) -- a warm pink partway along
// that gradient, since it's literally the transition between the two: the
// LLM answer is in, Piper is turning it into audio, but nothing's audible
// yet (see assistant_app.py's SYNTHESIZING state comment for why that
// distinction matters).
const PALETTE = {
  idle:         { c1: '#ffb27a', c2: '#ff8a5c' },
  listening:    { c1: '#ffd27a', c2: '#ffab5c' },
  recording:    { c1: '#ff8a6b', c2: '#ff6b5c' },
  transcribing: { c1: '#ffe27a', c2: '#ffb95c' },
  thinking:     { c1: '#e87ac9', c2: '#b06bff' },
  synthesizing: { c1: '#ff8ab0', c2: '#ff6b8a' },
  speaking:     { c1: '#ff9a6b', c2: '#ff7a5c' },
  muted:        { c1: '#7a7a85', c2: '#5c5c66' },
};

// Per-state motion "personality" -- this is what actually gives each
// waiting state its own feel, more than color alone. blobAmp controls how
// far the outline departs from a circle; speed controls how fast that
// departure rotates/breathes. thinking is deliberately the slowest but
// largest-amplitude -- a slow, hypnotic churn that's pleasant to watch
// during what's usually the longest wait in the whole turn, as opposed to
// a fast pulse that would read as "hurry up" or "something's wrong."
// transcribing is the opposite: quick and small, since it's a genuinely
// brief state and a big slow swirl would barely get going before it's
// over.
const STATE_MOTION = {
  idle:         { blobAmp: 0.05, speed: 0.45, breathe: 0.035 },
  listening:    { blobAmp: 0.06, speed: 0.55, breathe: 0.045 },
  recording:    { blobAmp: 0.08, speed: 0.85, breathe: 0.015 },
  transcribing: { blobAmp: 0.11, speed: 2.4,  breathe: 0.0   },
  thinking:     { blobAmp: 0.18, speed: 0.30, breathe: 0.0   },
  synthesizing: { blobAmp: 0.09, speed: 1.6,  breathe: 0.0   },
  speaking:     { blobAmp: 0.07, speed: 1.0,  breathe: 0.0   },
  muted:        { blobAmp: 0.02, speed: 0.2,  breathe: 0.0   },
};

function currentPalette() {
  return PALETTE[muted ? 'muted' : state] || PALETTE.idle;
}

function currentMotion() {
  return STATE_MOTION[muted ? 'muted' : state] || STATE_MOTION.idle;
}

// Traces a smooth, non-circular blob outline as the CURRENT canvas path
// (caller fills/strokes it) -- an organic, amorphous shape rather than a
// circle-with-pulsing-radius, which is both a deliberate visual break
// from the "perfect circle" look most voice assistants use, and the
// mechanism behind each state's distinct motion "personality" above.
// Samples `points` radii around the center, each modulated by a few sine
// harmonics at incommensurate angular frequencies (reads as organic, not
// mechanically regular), then traces a smooth closed curve through their
// midpoints via quadraticCurveTo -- the standard canvas technique for a
// soft blob outline instead of a jagged polygon.
function blobPath(cx, cy, baseR, seed, amp, speed, points = 10) {
  const angleStep = (Math.PI * 2) / points;
  const pts = [];
  for (let i = 0; i < points; i++) {
    const angle = i * angleStep;
    const noise = (
      Math.sin(angle * 3 + t * speed + seed) * 0.5 +
      Math.sin(angle * 5 - t * speed * 0.7 + seed * 1.7) * 0.3 +
      Math.sin(angle * 2 + t * speed * 0.4 + seed * 0.5) * 0.2
    );
    const r = baseR * (1 + noise * amp);
    pts.push([cx + Math.cos(angle) * r, cy + Math.sin(angle) * r]);
  }
  const last = pts[points - 1], first = pts[0];
  ctx.beginPath();
  ctx.moveTo((last[0] + first[0]) / 2, (last[1] + first[1]) / 2);
  for (let i = 0; i < points; i++) {
    const p0 = pts[i], p1 = pts[(i + 1) % points];
    ctx.quadraticCurveTo(p0[0], p0[1], (p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2);
  }
  ctx.closePath();
}

// Dot-particle overlays for the "processing" states (transcribing/thinking/
// synthesizing) -- on top of the blob's own per-state motion, not instead
// of it, per direct feedback that the blob's organic wobble alone read as
// too subtle to clearly say "something is happening." Two styles, mapped
// per state below: a slow-rotating spiral (phyllotaxis: each dot placed at
// the golden angle from the last, radius growing with sqrt(index) -- the
// standard technique for an evenly-filled, naturalistic "galaxy" spiral,
// as opposed to distinct rigid arms) for thinking, since it's usually the
// longest wait and can support something slower/more mesmerizing; and a
// pulsing grid (dots on a square lattice, clipped to the orb's circle,
// each one's size/brightness driven by an outward-traveling sine wave
// keyed on its own distance from center) for transcribing/synthesizing,
// since those are meant to read as quick, not something you'd want to
// stare at for a while. Colored per-state (lightenHex(pal.c1, ...) at draw
// time, not a fixed color) so the overlay reads as belonging to that
// state's own hue rather than a generic white loading spinner -- direct
// feedback after the first version (a fixed warm off-white) looked
// disconnected from the rest of the design. A THIRD overlay, expanding
// concentric rings (drawRingsOverlay, below), layers on top of both dot
// styles unconditionally during any processing state -- also direct
// feedback, after seeing dot-only vs dot+rings side by side: the rings add
// a second, independent "something is actively happening" cue (a classic
// radar/sonar-ping read) that reads well even before you consciously
// notice the dot pattern underneath.
const PARTICLE_OVERLAY = {
  thinking: 'spiral',
  transcribing: 'grid',
  synthesizing: 'grid',
};

// Blends a hex color toward white by `amount` (0..1) -- used to keep the
// overlay recognizably tinted the same hue as the state's own palette
// while staying bright/contrasty enough to read against the (often
// similarly-colored) blob underneath it.
function lightenHex(hex, amount) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const lr = Math.round(r + (255 - r) * amount);
  const lg = Math.round(g + (255 - g) * amount);
  const lb = Math.round(b + (255 - b) * amount);
  return `#${lr.toString(16).padStart(2, '0')}${lg.toString(16).padStart(2, '0')}${lb.toString(16).padStart(2, '0')}`;
}

function drawSpiralOverlay(cx, cy, baseR, tt, color) {
  const numDots = 110;
  const goldenAngle = 2.399963; // ~137.5 degrees in radians
  for (let i = 0; i < numDots; i++) {
    const frac = i / numDots;
    const angle = i * goldenAngle + tt * 0.6;
    const radius = baseR * (0.3 + 0.75 * Math.sqrt(frac));
    const x = cx + radius * Math.cos(angle);
    const y = cy + radius * Math.sin(angle);
    const dotR = 1.0 + 2.0 * (1 - frac);
    const alpha = 0.35 + 0.55 * (1 - frac);
    ctx.beginPath();
    ctx.arc(x, y, dotR, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(color, alpha);
    ctx.fill();
  }
}

function drawGridOverlay(cx, cy, baseR, tt, color) {
  const spacing = baseR * 0.22;
  const n = Math.ceil((baseR * 1.05) / spacing);
  for (let row = -n; row <= n; row++) {
    for (let col = -n; col <= n; col++) {
      const x = cx + col * spacing;
      const y = cy + row * spacing;
      const dist = Math.hypot(x - cx, y - cy);
      if (dist > baseR * 0.98) continue; // clip to the orb's circle
      const phase = (dist / baseR) * 5 - tt * 3; // outward-traveling pulse
      const pulse = Math.sin(phase) * 0.5 + 0.5;
      const dotR = 0.8 + pulse * 2.2;
      const alpha = 0.15 + pulse * 0.6;
      ctx.beginPath();
      ctx.arc(x, y, dotR, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(color, alpha);
      ctx.fill();
    }
  }
}

// Three thin rings expanding outward from just past the blob's edge, each
// fading out as it grows -- staggered by 1/3 of the cycle so there's
// always one at a different stage, like ripples or a radar sweep.
function drawRingsOverlay(cx, cy, baseR, tt, color) {
  const numRings = 3;
  for (let i = 0; i < numRings; i++) {
    const phase = (tt * 0.35 + i / numRings) % 1;
    const radius = baseR * (0.85 + phase * 0.55);
    const alpha = (1 - phase) * 0.4;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = hexToRgba(color, alpha);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function draw() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  const baseR = Math.min(w, h) * 0.28;

  // Smooth amplitude changes so bursty updates from Python don't look
  // like harsh jumps -- exponential approach toward the target.
  smoothedAmplitude += (targetAmplitude - smoothedAmplitude) * 0.15;

  const motion = currentMotion();
  const breathing = Math.sin(t * 0.6) * motion.breathe;
  const ampScale = smoothedAmplitude * 0.35; // how much speech loudness swells the orb

  const pal = currentPalette();
  const layers = 4;
  for (let i = 0; i < layers; i++) {
    const layerSeed = i * 2.1;
    const layerScale = 1 - i * 0.14;
    const r = baseR * layerScale * (1 + breathing + ampScale);

    const grad = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
    const alpha = 0.22 - i * 0.03;
    grad.addColorStop(0, hexToRgba(pal.c1, alpha * 1.4));
    grad.addColorStop(0.6, hexToRgba(pal.c2, alpha));
    grad.addColorStop(1, hexToRgba(pal.c2, 0));

    ctx.fillStyle = grad;
    blobPath(cx, cy, Math.max(r, 1), layerSeed, motion.blobAmp, motion.speed);
    ctx.fill();
  }

  // Solid core so the orb reads clearly even when amplitude is 0 -- a
  // much smaller blob amplitude than the outer layers so it still reads
  // as a clear "center", just not a perfectly dead circle either.
  const coreR = baseR * 0.5 * (1 + breathing * 0.5 + ampScale * 0.6);
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
  coreGrad.addColorStop(0, hexToRgba(pal.c1, 0.9));
  coreGrad.addColorStop(1, hexToRgba(pal.c2, 0.55));
  ctx.fillStyle = coreGrad;
  blobPath(cx, cy, Math.max(coreR, 1), 9.4, motion.blobAmp * 0.4, motion.speed);
  ctx.fill();

  const overlay = PARTICLE_OVERLAY[muted ? 'muted' : state];
  if (overlay) {
    const particleColor = lightenHex(pal.c1, 0.55);
    if (overlay === 'spiral') drawSpiralOverlay(cx, cy, baseR, t, particleColor);
    if (overlay === 'grid') drawGridOverlay(cx, cy, baseR, t, particleColor);
    drawRingsOverlay(cx, cy, baseR, t, particleColor);
  }

  t += 1 / 60;
  window.__frameCount = (window.__frameCount || 0) + 1; // exposed for automated testing
  requestAnimationFrame(draw);
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

requestAnimationFrame(draw);

// ---- Public API (called from Python via window.evaluate_js) ---------
function setState(newState) {
  state = newState;
  document.getElementById('status-label').textContent = muted ? 'muted' : newState;
}

function setAmplitude(level) {
  // level expected 0..1
  targetAmplitude = Math.max(0, Math.min(1, level));
}

function setMuted(isMuted) {
  muted = isMuted;
  const btn = document.getElementById('mute-btn');
  btn.classList.toggle('muted', isMuted);
  btn.innerHTML = isMuted ? '&#128263;' : '&#128266;';
  document.getElementById('status-label').textContent = isMuted ? 'muted' : state;
}

// Briefly overrides status-label to show the new sensitivity level, then
// reverts to the normal state text -- same label element setState() uses,
// so the two need to not fight: the timeout always restores whatever
// setState()'s own tracked `state`/`muted` currently are, not a stale
// value from whenever the sensitivity change happened.
let sensitivityLabelTimeout = null;
function setSensitivityLabel(level) {
  const btn = document.getElementById('sensitivity-btn');
  btn.textContent = { low: 'L', medium: 'M', high: 'H' }[level] || '?';
  btn.title = `Mic sensitivity: ${level} (click to change)`;

  const statusEl = document.getElementById('status-label');
  statusEl.textContent = `sensitivity: ${level}`;
  if (sensitivityLabelTimeout) clearTimeout(sensitivityLabelTimeout);
  sensitivityLabelTimeout = setTimeout(() => {
    statusEl.textContent = muted ? 'muted' : state;
    sensitivityLabelTimeout = null;
  }, 1500);
}

window.setState = setState;
window.setAmplitude = setAmplitude;
window.setMuted = setMuted;
window.setSensitivityLabel = setSensitivityLabel;

// ---- Mute button: calls back into Python if the pywebview bridge is
// present; falls back to local-only toggle for standalone browser testing.
document.getElementById('mute-btn').addEventListener('click', () => {
  const next = !muted;
  if (window.pywebview && window.pywebview.api && window.pywebview.api.toggle_mute) {
    window.pywebview.api.toggle_mute(next);
  } else {
    console.log('[standalone] toggle_mute ->', next);
  }
  setMuted(next);
});

// ---- Sensitivity button: cycles low -> medium -> high -> low. Python
// owns the actual value and pushes the new label back via
// setSensitivityLabel() (both here and at startup) -- single source of
// truth, this doesn't guess/set it locally.
document.getElementById('sensitivity-btn').addEventListener('click', () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.cycle_sensitivity) {
    window.pywebview.api.cycle_sensitivity();
  } else {
    console.log('[standalone] cycle_sensitivity (no-op outside pywebview)');
  }
});

// ---- Minimize button.
document.getElementById('minimize-btn').addEventListener('click', () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.minimize) {
    window.pywebview.api.minimize();
  } else {
    console.log('[standalone] minimize (no-op outside pywebview)');
  }
});

// ---- Window dragging: pywebview's Windows backend has no built-in
// frameless-drag support. Two earlier attempts using the raw Win32
// "fake a title-bar click" trick (WM_NCLBUTTONDOWN/HTCAPTION) didn't
// actually move the window -- so instead of that, this tracks screen-
// space mouse deltas here in JS and calls into Python
// (assistant_app.py's Api.drag_move) to reposition the window via
// pywebview's own documented window.move() API each step. No-ops
// harmlessly in a standalone browser tab.
//
// mousemove can fire 60-125+ times/sec, and each drag_move() is an async
// round-trip over the JS<->Python bridge. Capping to one call per rAF
// frame (~60fps) wasn't actually enough on its own: nothing stopped a
// second call firing before the first one's promise resolved, so if any
// single round-trip took longer than one frame, calls piled up faster
// than they drained -- the window visibly trailing behind the cursor
// with growing lag. Fixed with real backpressure: never more than one
// drag_move in flight at a time, and always send the freshest known
// position once the previous call finishes (skipping stale in-between
// positions rather than queueing all of them).
let dragging = false;
let latestScreenPos = null;
let lastSentScreenPos = null;
let dragCallInFlight = false;

async function dragTick() {
  if (dragging && !dragCallInFlight && latestScreenPos &&
      (!lastSentScreenPos || latestScreenPos[0] !== lastSentScreenPos[0] || latestScreenPos[1] !== lastSentScreenPos[1])) {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_move) {
      const pos = latestScreenPos;
      lastSentScreenPos = pos;
      dragCallInFlight = true;
      try {
        await window.pywebview.api.drag_move(pos[0], pos[1]);
      } finally {
        dragCallInFlight = false;
      }
    }
  }
  requestAnimationFrame(dragTick);
}
requestAnimationFrame(dragTick);

document.getElementById('drag-region').addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  dragging = true;
  latestScreenPos = lastSentScreenPos = [e.screenX, e.screenY];
  if (window.pywebview && window.pywebview.api && window.pywebview.api.start_drag) {
    window.pywebview.api.start_drag(e.screenX, e.screenY);
  } else {
    console.log('[standalone] start_drag (no-op outside pywebview)');
  }
});
document.addEventListener('mousemove', (e) => {
  if (!dragging || !(e.buttons & 1)) return;
  latestScreenPos = [e.screenX, e.screenY];
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  latestScreenPos = lastSentScreenPos = null;
  if (window.pywebview && window.pywebview.api && window.pywebview.api.end_drag) {
    window.pywebview.api.end_drag();
  }
});
</script>
</body>
</html>
